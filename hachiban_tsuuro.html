<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>八番通路 — 異変探しホラー</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#eee;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;text-shadow:0 2px 8px #000}.title{font-size:12px;letter-spacing:.35em;color:#aab1b8}.level{font-size:25px;font-weight:700;margin-top:4px}.hint{font-size:12px;color:#d0d4d8;margin-top:7px}.bottom{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;gap:12px}.controls{display:flex;gap:10px;pointer-events:auto}.btn{border:1px solid #ffffff50;background:#101419c9;color:#fff;border-radius:16px;min-width:74px;min-height:66px;padding:10px 14px;font-size:14px;backdrop-filter:blur(8px);box-shadow:0 4px 20px #0007}.btn:active{background:#424950}.btn small{display:block;font-size:10px;color:#aeb8c0;margin-top:5px}.status{font-size:12px;line-height:1.7;text-shadow:0 2px 8px #000;max-width:45%;text-align:right}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse,#171c21eF,#020304f7);z-index:5}.panel{max-width:440px;width:100%;text-align:center;padding:28px 22px;border:1px solid #ffffff25;background:#090c10e8;border-radius:20px;box-shadow:0 20px 70px #0009}.panel h1{font-size:30px;letter-spacing:.15em;margin:0 0 8px}.panel p{font-size:14px;color:#b7c0c8;line-height:1.9}.primary{margin-top:14px;width:100%;padding:16px;border:0;border-radius:12px;background:#e5e8eb;color:#101316;font-size:16px;font-weight:700}.tiny{font-size:11px!important;color:#737e87!important}.flash{position:fixed;inset:0;background:#e9edf0;opacity:0;pointer-events:none;z-index:4}.flash.go{animation:flash .65s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}#message{position:absolute;top:32%;left:10%;right:10%;text-align:center;font-size:20px;font-weight:700;text-shadow:0 3px 12px #000;opacity:0;transition:opacity .2s}#message.show{opacity:1}.hide{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="top"><div class="title">EXIT OBSERVATION PROJECT</div><div class="level" id="level">第 0 通路</div><div class="hint" id="hint">通路の異変を見逃すな</div></div>
 <div id="message"></div>
 <div class="bottom"><div class="controls"><button class="btn" id="turn">↶ 振り返る<small>異変があれば戻る</small></button><button class="btn" id="forward">前へ進む ↗<small>異変がなければ進む</small></button></div><div class="status" id="status">異変の有無を観察<br>出口を目指せ</div></div>
</div>
<div class="flash" id="flash"></div>
<div class="overlay" id="intro"><div class="panel"><h1>八番通路</h1><p>無人の地下通路を進み、異変を見つけよう。<br>異変があれば引き返す。なければ進む。<br>間違えると、何かが近づいてくる。</p><p class="tiny">画面下のボタンで操作します。音は任意です。</p><button class="primary" id="start">通路に入る</button></div></div>
<div class="overlay hide" id="end"><div class="panel"><h1 id="endTitle">脱出</h1><p id="endText"></p><button class="primary" id="restart">もう一度プレイ</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const root=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080b0e); scene.fog=new THREE.Fog(0x080b0e,8,35);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,100); camera.position.set(0,1.65,4.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9eafc4,0x17191b,1.35));
const light=new THREE.PointLight(0xe1e9ff,22,17);light.position.set(0,3.3,0);scene.add(light);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const floorMat=mat(0x35383b),wallMat=mat(0x92969a),darkMat=mat(0x24282b),trimMat=mat(0x5d646a,.65,.25),tileMat=mat(0xb8bdc0,.6),signMat=mat(0x132d25);
function cube(w,h,d,material,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);scene.add(o);return o}
cube(5,.2,42,floorMat,0,-.12,-15);cube(5,.2,42,darkMat,0,3.65,-15);cube(.18,3.7,42,wallMat,-2.5,1.75,-15);cube(.18,3.7,42,wallMat,2.5,1.75,-15);
for(let z=3;z>-36;z-=3){cube(4.7,.035,.035,trimMat,0,.01,z);cube(.025,3.35,.06,trimMat,-2.39,1.7,z);cube(.025,3.35,.06,trimMat,2.39,1.7,z)}
for(let z=2;z>-33;z-=6){let lamp=cube(.8,.08,1.3,tileMat,0,3.49,z);let l=new THREE.PointLight(0xd8e7ff,9,8);l.position.set(0,3.2,z);scene.add(l)}
// Repeated wall panels and doors
for(let z=1;z>-32;z-=4){cube(.035,1.6,.06,trimMat,-2.39,1.3,z);cube(.035,1.6,.06,trimMat,2.39,1.3,z)}
function makeSign(text,x,y,z){const c=document.createElement('canvas');c.width=256;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#102c22';ctx.fillRect(0,0,256,96);ctx.strokeStyle='#9dd6b5';ctx.lineWidth=5;ctx.strokeRect(4,4,248,88);ctx.fillStyle='#d6f6df';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(text,128,62);const t=new THREE.CanvasTexture(c);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.6),new THREE.MeshBasicMaterial({map:t}));mesh.position.set(x,y,z);scene.add(mesh);return mesh}
const sign=makeSign('出口  →',0,2.85,-8);
const anomalies=[];
function resetAnomalies(){for(const a of anomalies){scene.remove(a);a.geometry?.dispose();}anomalies.length=0;sign.material.map.needsUpdate=true;sign.rotation.y=0;sign.position.x=0;sign.position.y=2.85;sign.material.color.set(0xffffff);
 // occasional altered signage
 if(Math.random()<.5){sign.position.x=Math.random()<.5?-.35:.35;sign.position.y=2.65;sign.rotation.y=.12;sign.material.color.set(0xffc4c4);anomalies.push(sign)}
 if(Math.random()<.35){let d=cube(.9,1.7,.12,mat(0x161a1e),Math.random()<.5?-2.38:2.38,1.1,-12);anomalies.push(d)}
 if(Math.random()<.35){let bulb=cube(.65,.07,1.2,mat(0x492b2b),0,3.48,-6);anomalies.push(bulb)}
 if(Math.random()<.28){let stain=cube(.7,.45,.04,mat(0x25292c),-2.39,2.2,-18);anomalies.push(stain)}
 if(Math.random()<.25){let silhouette=makeFigure();anomalies.push(silhouette)}
}
function makeFigure(){const g=new THREE.Group();const black=mat(0x07090a);let body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.34,1.25,8),black);body.position.y=1.05;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.24,10,8),mat(0x0b0b0c));head.position.y=1.86;g.add(head);g.position.set(Math.random()<.5?-1.25:1.25,0,-15);scene.add(g);return g}
let active=false,level=0,mistakes=0,hasAnomaly=false,turned=false,scareCooldown=0,walk=0,lookBack=false;
const levelEl=document.getElementById('level'),hintEl=document.getElementById('hint'),statusEl=document.getElementById('status'),msg=document.getElementById('message');
function say(s){msg.textContent=s;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),1500)}
function updateHUD(){levelEl.textContent=`第 ${level} 通路`;statusEl.innerHTML=`判断ミス：${mistakes} 回<br>異変を探して出口へ`;hintEl.textContent=level===0?'周囲をよく観察しよう':'この通路に異変はある？'}
function start(){document.getElementById('intro').classList.add('hide');document.getElementById('end').classList.add('hide');level=0;mistakes=0;walk=0;camera.position.set(0,1.65,4.5);camera.rotation.set(0,0,0);lookBack=false;active=true;newCorridor();updateHUD()}
function newCorridor(){resetAnomalies();hasAnomaly=anomalies.length>0;turned=false;camera.position.z=4.5;camera.rotation.y=0;lookBack=false;updateHUD()}
function soundScare(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();const osc=ac.createOscillator(),gain=ac.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(180,ac.currentTime);osc.frequency.exponentialRampToValueAtTime(48,ac.currentTime+.45);gain.gain.setValueAtTime(.0001,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.35,ac.currentTime+.04);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.65);osc.connect(gain);gain.connect(ac.destination);osc.start();osc.stop(ac.currentTime+.7);setTimeout(()=>ac.close(),900)}catch(e){}}
function scare(){if(scareCooldown>0)return;scareCooldown=3;const g=makeFigure();g.position.set(0,0,-.7);g.scale.set(2.1,2.1,2.1);g.rotation.y=Math.PI;const flash=document.getElementById('flash');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');soundScare();say('……うしろに、いる。');setTimeout(()=>{scene.remove(g);},900)}
function decide(goForward){if(!active)return;
 if(goForward && hasAnomaly){mistakes++;say('異変を見逃した……');scare();if(mistakes>=3){finish(false);return}}
 else if(!goForward && !hasAnomaly){mistakes++;say('何もない通路だった……');if(mistakes>=3){scare();finish(false);return}}
 else {level++;say(goForward?'正しい判断だ':'異変を回避した');}
 if(level>=8){finish(true);return}newCorridor()}
function finish(win){active=false;document.getElementById('end').classList.remove('hide');document.getElementById('endTitle').textContent=win?'脱出成功':'通路に呑まれた';document.getElementById('endText').textContent=win?`8つの判断を乗り越え、通路から脱出した。判断ミス：${mistakes}回`:`判断ミスが重なり、出口を見失った。到達通路：${level}。もう一度、周囲をよく観察しよう。`}
document.getElementById('start').addEventListener('click',start);document.getElementById('restart').addEventListener('click',start);
document.getElementById('forward').addEventListener('click',()=>{if(!active)return;camera.rotation.y=0;camera.position.z-=.7;walk++;decide(true)});
document.getElementById('turn').addEventListener('click',()=>{if(!active)return;camera.rotation.y=Math.PI;lookBack=true;decide(false);setTimeout(()=>{if(active){camera.rotation.y=0;lookBack=false}},450)});
let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000||0,.05);last=t;if(scareCooldown>0)scareCooldown-=dt;if(active){camera.position.y=1.65+Math.sin(t*.004)*.012;light.intensity=21+Math.sin(t*.012)*.7;if(Math.random()<.002)light.intensity=3;}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body></html>
