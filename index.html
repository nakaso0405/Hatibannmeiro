<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>八番通路 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#eee;font-family:-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#shade{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse,transparent 35%,#0009 100%)}#top{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;font-size:12px;text-shadow:0 2px 6px #000}.pill{background:#0b0d10d9;border:1px solid #ffffff25;border-radius:99px;padding:8px 11px}#message{position:fixed;z-index:4;top:23%;left:8%;right:8%;text-align:center;color:#e4d9ca;text-shadow:0 2px 8px #000;font-size:15px}#controls{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 12px;gap:8px}.pad{display:grid;grid-template-columns:52px 52px;gap:6px}button{color:#f4f1e9;background:#101317e8;border:1px solid #ffffff35;border-radius:13px;min-height:50px;min-width:52px;font-size:13px;font-weight:600;touch-action:manipulation}button:active{background:#353940}#forward{min-width:88px;min-height:62px}#look{display:flex;flex-direction:column;gap:7px}#sound{position:fixed;z-index:6;right:12px;top:calc(env(safe-area-inset-top) + 55px);min-height:36px;min-width:80px;font-size:12px}#overlay{position:fixed;z-index:10;inset:0;background:radial-gradient(ellipse,#161a20ee,#030405fa);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.panel{width:min(420px,100%);padding:25px 20px;border:1px solid #ffffff22;border-radius:22px;background:#080a0dee}h1{font-size:30px;letter-spacing:.15em;margin:0 0 8px}.sub{color:#aaa;font-size:12px;letter-spacing:.22em;margin-bottom:22px}p{font-size:14px;line-height:1.8;color:#c6c6c6}#start{width:100%;margin-top:10px;min-height:52px;background:#ded6c8;color:#101113;border:0}#hint{font-size:11px;color:#777}.hidden{display:none!important}#flash{position:fixed;inset:0;background:#eee;opacity:0;pointer-events:none;z-index:8;transition:opacity .08s}
</style></head><body><div id="game"></div><div id="shade"></div><div id="flash"></div><div id="top"><div class="pill">八番通路 <span id="level">・入口</span></div><div class="pill" id="count">異変を見つけて脱出</div></div><div id="message"></div><button id="sound">🔊 音 ON</button><button id="flashlight" style="position:fixed;z-index:6;left:12px;top:calc(env(safe-area-inset-top) + 55px);min-height:36px;min-width:105px;font-size:12px">🔦 ライト ON</button>
<div id="controls" class="hidden"><div class="pad"><button id="left">◀ 左</button><button id="right">右 ▶</button><button id="back">▼ 後退</button><button id="turn">↶ 振返る</button></div><div id="look"><button id="forward">前へ進む ↑</button><button id="lookL">視線 ◀</button><button id="lookR">視線 ▶</button></div></div>
<div id="overlay"><div class="panel"><h1>八番通路</h1><div class="sub">FIRST-PERSON 3D HORROR</div><p>不自然なものがあれば引き返す。<br>何もなければ前へ進む。<br>8回正しく判断すると脱出できる。</p><p id="loadnote">3D通路を準備中…</p><button id="start">ゲーム開始</button><p id="hint">iPhone用・画面ボタン操作 / 音は開始後にON</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';
const root=document.querySelector('#game'),overlay=document.querySelector('#overlay'),controls=document.querySelector('#controls'),msg=document.querySelector('#message'),count=document.querySelector('#count'),level=document.querySelector('#level');
let scene,camera,renderer,objs=[],shadows=[],active=false,pass=0,odd=false,soundOn=true,ctx=null,drone=null,flashlightOn=true,flashlight=null,flashTarget=null,dragging=false,lastX=0,lastY=0,swipeStartX=0,swipeStartY=0;
const mat=(c,r=.85,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,emissive:e});
const wall=mat(0x77766f),floor=mat(0x343638),ceiling=mat(0x55565a),black=mat(0x030405),sign=mat(0x173322);
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);objs.push(o);return o}
function label(text){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#173322';g.fillRect(0,0,256,64);g.fillStyle='#e4eadf';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(text,128,44);const t=new THREE.CanvasTexture(c);return new THREE.Mesh(new THREE.PlaneGeometry(1.15,.29),new THREE.MeshBasicMaterial({map:t}))}
function person(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);const head=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),black);head.position.y=1.55;g.add(head);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.68,3,7),black);body.position.y=.95;g.add(body);for(const q of [-1,1]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.62,6),black);leg.position.set(q*.12,.31,0);g.add(leg);let arm=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,.7,6),black);arm.position.set(q*.28,1.02,0);g.add(arm);let eye=new THREE.Mesh(new THREE.SphereGeometry(.022,6,5),new THREE.MeshBasicMaterial({color:0xd8cdb0}));eye.position.set(q*.065,1.57,-.145);g.add(eye)}scene.add(g);shadows.push(g)}
function clear(){for(const o of objs){scene.remove(o);o.traverse?.(n=>{n.geometry?.dispose()})}objs=[];for(const s of shadows)scene.remove(s);shadows=[]}
function hall(){clear();box(0,-.12,-18,5,.24,48,floor);box(0,3.25,-18,5,.2,48,ceiling);box(-2.55,1.55,-18,.18,3.2,48,wall);box(2.55,1.55,-18,.18,3.2,48,wall);box(0,1.45,-41,4.9,2.9,.18,wall);for(let z=-4;z>-39;z-=4){for(const x of [-2.43,2.43])box(x,1.5,z,.04,2.65,.08,mat(0x4a4b49));box(0,3.12,z,1.25,.035,.5,new THREE.MeshBasicMaterial({color:0xcbd7cc}))}box(0,2.55,-38,1.15,.35,.07,sign);const t=label('出口 →');t.position.set(0,2.55,-37.94);scene.add(t);objs.push(t);odd=Math.random()<.52;if(odd){const type=Math.floor(Math.random()*5);if(type===0)person(Math.random()<.5?-.8:.8,-12,.95);if(type===1)person(0,-27,1.2);if(type===2)person(1.7,-18,.85);if(type===3)person(-1.8,-22,.8);if(type===4){person(-.7,-31,.8);person(.7,-31,.8)}msg.textContent=type===4?'……向こうに、誰かいる。':''}else msg.textContent=''}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090b0e);scene.fog=new THREE.FogExp2(0x090b0e,.035);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,90);camera.position.set(0,1.62,1);camera.rotation.order='YXZ';renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x657080,0x100e0d,.42));for(let z=-4;z>-40;z-=8){const l=new THREE.PointLight(0x9ba99f,7,10,2);l.position.set(0,2.9,z);scene.add(l)}
// Flashlight follows the camera direction; target is kept in front of the player.
flashlight=new THREE.SpotLight(0xe4eadf,32,24,Math.PI/7,.42,1.4);flashlight.position.set(0,0,0);flashTarget=new THREE.Object3D();flashTarget.position.set(0,0,-1);camera.add(flashlight);camera.add(flashTarget);flashlight.target=flashTarget;scene.add(camera);
hall();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#loadnote').textContent='3Dエンジン読み込み完了';
const canvas=renderer.domElement;
canvas.style.touchAction='none';
canvas.addEventListener('pointerdown',e=>{if(!active)return;dragging=true;lastX=e.clientX;lastY=e.clientY;swipeStartX=e.clientX;swipeStartY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!dragging||!active)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;camera.rotation.y-=dx*.006;camera.rotation.x-=dy*.004;camera.rotation.x=Math.max(-.55,Math.min(.55,camera.rotation.x));});
function stopDrag(){dragging=false}
canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
renderer.setAnimationLoop(t=>{camera.position.y=1.62+Math.sin(t*.002)*.012;if(flashlight)flashlight.intensity=flashlightOn?(Math.random()<.012?8:32):0;renderer.render(scene,camera)});
}
function audio(){if(!soundOn)return;try{if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();const g=ctx.createGain();g.gain.value=.1;g.connect(ctx.destination);const o=ctx.createOscillator();o.type='sine';o.frequency.value=48;o.connect(g);o.start();drone={g,o}}ctx.resume()}catch(e){}}
function beep(f=110,d=.2,v=.04,type='sine'){if(!soundOn)return;audio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function start(){pass=0;camera.position.set(0,1.62,1);camera.rotation.set(0,0,0);flashlightOn=true;const fl=document.querySelector('#flashlight');if(fl)fl.textContent='🔦 ライト ON';if(flashlight)flashlight.intensity=32;active=true;overlay.classList.add('hidden');controls.classList.remove('hidden');audio();hall();hud()}
function hud(){count.textContent=`通過 ${pass} / 8`;level.textContent=`・区間 ${pass+1}`}
function move(dx,dz){if(!active)return;let a=camera.rotation.y;camera.position.x+=Math.cos(a)*dx+Math.sin(a)*dz;camera.position.z+=-Math.sin(a)*dx+Math.cos(a)*dz;camera.position.x=Math.max(-1.9,Math.min(1.9,camera.position.x));camera.position.z=Math.min(2,Math.max(-34,camera.position.z));beep(65,.07,.012,'triangle')}
function decide(turn){if(!active)return;const ok=turn===odd;if(ok){pass++;beep(turn?260:150,.16,.035);msg.textContent=turn?'異変を見抜いた。':'何もおかしくない。';if(pass>=8){finish(true);return}camera.position.set(0,1.62,1);camera.rotation.set(0,0,0);hall();hud()}else{beep(42,.8,.12,'sawtooth');finish(false)}}
function finish(win){active=false;controls.classList.add('hidden');document.querySelector('#flash').style.opacity=win?'0':'.8';setTimeout(()=>document.querySelector('#flash').style.opacity='0',110);overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=win?'脱出成功':'見つかった';overlay.querySelector('.sub').textContent=win?'YOU ESCAPED':'GAME OVER';overlay.querySelector('p').innerHTML=win?'異変を見極め、通路から脱出した。':'判断を間違えた……<br>もう一度、通路を調べよう。';document.querySelector('#start').textContent='もう一度遊ぶ'}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#forward').addEventListener('click',()=>{if(camera.position.z>-32)move(0,-2.1);else decide(false)});document.querySelector('#back').addEventListener('click',()=>move(0,1.2));document.querySelector('#left').addEventListener('click',()=>move(-.65,0));document.querySelector('#right').addEventListener('click',()=>move(.65,0));document.querySelector('#turn').addEventListener('click',()=>decide(true));document.querySelector('#lookL').addEventListener('click',()=>camera.rotation.y+=.28);document.querySelector('#lookR').addEventListener('click',()=>camera.rotation.y-=.28);document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF';if(soundOn)audio();else if(drone)drone.g.gain.setTargetAtTime(.001,ctx.currentTime,.1)});document.querySelector('#flashlight').addEventListener('click',e=>{flashlightOn=!flashlightOn;e.currentTarget.textContent=flashlightOn?'🔦 ライト ON':'🌑 ライト OFF';if(flashlight)flashlight.intensity=flashlightOn?32:0;});try{init()}catch(e){document.querySelector('#loadnote').textContent='3D読み込みに失敗。通信を確認して再読み込みしてね。'}
</script></body></html>
